name: Zoonova 3x Daily Market Intelligence

on:
  schedule:
    - cron: '30 12,13 * * 1-5'
    - cron: '0 18,19,21,22 * * 1-5'
  workflow_dispatch:
    inputs:
      session_override:
        description: 'Session Override'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - pre_market
          - midday
          - post_close

permissions:
  contents: write

jobs:
  run-publisher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai google-auth markdown requests

      - name: Run Zoonova Analysis Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZOONOVA_BASE_URL: "https://zoonova.com"
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python - << 'EOF'
          import os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          override = "${{ github.event.inputs.session_override }}"
          if override and override != "auto":
              ret = os.system(f"python zoonova_publisher.py --session {override}")
              sys.exit(ret >> 8)

          ny_now = datetime.now(ZoneInfo("America/New_York"))
          hour, minute = ny_now.hour, ny_now.minute

          if hour == 8 and 25 <= minute <= 45:
              ret = os.system("python zoonova_publisher.py --session pre_market")
          elif hour == 14 and minute <= 15:
              ret = os.system("python zoonova_publisher.py --session midday")
          elif hour == 17 and minute <= 15:
              ret = os.system("python zoonova_publisher.py --session post_close")
          else:
              print(f"Skipping run: Current NY time is {ny_now.strftime('%H:%M')}. Not within a trigger window.")
              sys.exit(0)

          sys.exit(ret >> 8)
          EOF

      - name: Commit and Push Generated Reports
        run: |
          git config --global user.name "Zoonova Engine Bot"
          git config --global user.email "bot@zoonova.com"
          git add reports/ index.html
          if git diff --staged --quiet; then
            echo "No report updates to commit."
          else
            git commit -m "Auto-publish market intelligence [skip ci]"
            git push
          fi
